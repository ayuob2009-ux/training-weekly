<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>إصلاح البيانات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  body{
    margin:0; min-height:100vh;
    background:#f1e8d3;
    font-family:'Tajawal', sans-serif;
    color:#3a2f21;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
  }
  .card{
    max-width:480px; width:100%;
    background:#faf5e6;
    border:1px solid rgba(58,47,33,0.16);
    border-radius:16px;
    padding:24px;
    box-shadow:0 8px 24px rgba(58,47,33,0.12);
  }
  h1{ font-family:'Cairo',sans-serif; font-size:20px; margin:0 0 12px; color:#1f4a30; }
  p{ font-size:14.5px; line-height:1.8; color:#5c5142; margin:0 0 16px; }
  button{
    width:100%;
    background:#d9a441; color:#1f4a30;
    border:none; border-radius:10px;
    font-family:'Cairo',sans-serif; font-weight:700; font-size:15px;
    padding:13px; cursor:pointer;
  }
  button:disabled{ opacity:0.6; cursor:not-allowed; }
  #status{ margin-top:16px; font-size:14px; white-space:pre-wrap; line-height:1.9; }
  .ok{ color:#1f4a30; font-weight:700; }
  .err{ color:#b3392f; font-weight:700; }
</style>
</head>
<body>
<div class="card">
  <h1>إصلاح مراكز ومهارات اللاعبين</h1>
  <p>
    هذي أداة إصلاح تشتغل مرة وحدة بس. تصحح كل الخانات والمهارات اللي تزحزحت
    بسبب إضافة "الكثيري" بمنتصف القائمة (بعد الناجم مباشرة). بعد الإصلاح
    احذف هالصفحة، ما تحتاجها مرة ثانية.
  </p>
  <button id="fixBtn" onclick="runFix()">إصلاح البيانات الآن</button>
  <div id="status"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBcxBeY7pjJ5iEHB45-wJh6Pre0qSnZdVI",
    authDomain: "training-f7016.firebaseapp.com",
    projectId: "training-f7016",
    storageBucket: "training-f7016.firebasestorage.app",
    messagingSenderId: "263642447317",
    appId: "1:263642447317:web:664999b5955045eac2915c",
    measurementId: "G-XH8BPJJHQ2"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const sharedRef = doc(db, 'lineup', 'shared');

  // موضع "الكثيري" الجديد بالقائمة (٠-بداية العد): بعد الناجم مباشرة = index 1
  const INSERT_INDEX = 1;

  function log(text, cls){
    const el = document.getElementById('status');
    const span = document.createElement('div');
    if(cls) span.className = cls;
    span.textContent = text;
    el.appendChild(span);
  }

  window.runFix = async function(){
    const btn = document.getElementById('fixBtn');
    btn.disabled = true;
    document.getElementById('status').innerHTML = '';
    log('جاري القراءة من قاعدة البيانات...');

    try{
      const snap = await getDoc(sharedRef);
      if(!snap.exists()){
        log('ما فيه بيانات محفوظة أصلاً — لا يوجد شي للإصلاح.', 'err');
        btn.disabled = false;
        return;
      }
      const data = snap.data();
      const oldPositions = data.positions || {};
      const oldSkills = data.skills || {};
      const oldSelected = data.selected || [];
      const namesCount = (data.names || '').split('\n').map(s => s.trim()).filter(Boolean).length;

      log(`عدد الأسماء الحالي بالقائمة: ${namesCount}`);
      log(`نقطة الإدراج المفترضة: بعد اللاعب رقم ${INSERT_INDEX} (٠-بداية العد)`);

      // تصحيح المراكز والمهارات: كل من كان قبل نقطة الإدراج يبقى كما هو،
      // من بعدها للأمام يرجع لمكانه القديم (قبل ما تنزاح البيانات)
      function shiftMap(oldMap){
        const fixed = {};
        for(const key in oldMap){
          const oldIdx = Number(key);
          if(Number.isNaN(oldIdx)) continue;
          if(oldIdx < INSERT_INDEX){
            fixed[oldIdx] = oldMap[key];
          } else {
            fixed[oldIdx + 1] = oldMap[key];
          }
        }
        return fixed;
      }

      const fixedPositions = shiftMap(oldPositions);
      const fixedSkills = shiftMap(oldSkills);

      // تصحيح قائمة الاختيار الحالية (الفهارس) بنفس المنطق
      const fixedSelected = oldSelected.map(idx =>
        idx < INSERT_INDEX ? idx : idx + 1
      );

      log('تم حساب التصحيح، جاري الحفظ...');

      await setDoc(sharedRef, {
        positions: fixedPositions,
        skills: fixedSkills,
        selected: fixedSelected
      }, { merge: true });

      log('تم الإصلاح بنجاح ✓', 'ok');
      log('ارجع لتطبيق التشكيلة وتأكد إن كل لاعب رجع لمركزه ومهارته الصحيحة.');
      log('لو كل شي تمام، احذف هالصفحة ولا تستخدمها مرة ثانية.');
    } catch(err){
      log('صار خطأ: ' + (err && err.message ? err.message : String(err)), 'err');
      btn.disabled = false;
    }
  };
</script>
</body>
</html>
