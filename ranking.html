<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الترتيب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pitch: #2f6b46;
    --pitch-dark: #1f4a30;
    --chalk: #3a2f21;
    --chalk-dim: #8a7a63;
    --cream: #faf5e6;
    --cream-dim: rgba(250,245,230,0.75);
    --gold: #c8892c;
    --gold-fill: #d9a441;
    --red-card: #b3392f;
    --line: rgba(58,47,33,0.16);
    --paper: #f1e8d3;
    --card-bg: rgba(250,245,230,0.72);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    position:relative;
    background-color: var(--paper);
    background-image:
      radial-gradient(ellipse 500px 340px at 8% 0%, rgba(47,107,70,0.10), transparent 60%),
      radial-gradient(ellipse 500px 340px at 92% 0%, rgba(200,137,44,0.12), transparent 60%);
    font-family:'Tajawal', sans-serif;
    color: var(--chalk);
    padding: 24px 16px 60px;
  }
  body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background-repeat: no-repeat, no-repeat;
    background-image:
      radial-gradient(circle, transparent 0 118px, rgba(58,47,33,0.09) 118px 121px, transparent 121px),
      linear-gradient(rgba(58,47,33,0.09), rgba(58,47,33,0.09));
    background-size: 240px 240px, 2px 640px;
    background-position: 50% 38%, 50% 38%;
    z-index:0;
  }
  body::after{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background-repeat: repeat-x;
    background-image:
      repeating-linear-gradient(-35deg, rgba(58,47,33,0.05) 0 10px, transparent 10px 22px);
    background-position: 0 0;
    background-size: 100% 90px;
    opacity:0.4;
    z-index:0;
  }
  .wrap{max-width:640px; margin:0 auto; position:relative; z-index:1;}

  .top-nav{
    display:flex;
    justify-content:center;
    gap:8px;
    margin-bottom:18px;
  }
  .top-nav a{
    font-family:'Cairo', sans-serif;
    font-size:13px;
    font-weight:700;
    text-decoration:none;
    color: var(--chalk-dim);
    background: var(--card-bg);
    border: 1px solid var(--line);
    padding:8px 18px;
    border-radius:999px;
    transition: all .15s ease;
  }
  .top-nav a:hover{ color: var(--chalk); border-color: var(--chalk-dim); }
  .top-nav a.active{
    color: var(--cream);
    background: var(--pitch-dark);
    border-color: var(--pitch-dark);
  }

  header{
    text-align:center;
    margin-bottom:22px;
  }
  .eyebrow{
    font-family:'Cairo', sans-serif;
    font-size:13px;
    letter-spacing:2px;
    color: var(--gold);
    text-transform:uppercase;
    margin-bottom:6px;
  }
  h1{
    font-family:'Cairo', sans-serif;
    font-weight:900;
    font-size: clamp(28px, 6vw, 40px);
    margin:0;
    line-height:1.15;
    color: var(--pitch-dark);
  }
  .sub{
    color: var(--chalk-dim);
    font-size:14px;
    margin-top:8px;
  }

  .card{
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius:16px;
    padding:18px;
    margin-bottom:18px;
    box-shadow: 0 6px 18px rgba(58,47,33,0.08);
  }
  .card h2{
    font-family:'Cairo', sans-serif;
    font-size:16px;
    margin:0 0 14px;
    color: var(--gold);
  }

  table{
    width:100%;
    border-collapse:collapse;
  }
  thead th{
    font-family:'Cairo', sans-serif;
    font-size:12.5px;
    font-weight:700;
    color: var(--chalk-dim);
    text-align:right;
    padding:0 8px 10px;
    border-bottom:1px solid var(--line);
  }
  thead th.center{ text-align:center; }
  tbody td{
    padding:10px 8px;
    border-bottom:1px solid var(--line);
    font-size:15px;
    vertical-align:middle;
  }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:nth-child(1) .rank-badge{ background: var(--gold-fill); color: var(--pitch-dark); }
  tbody tr:nth-child(2) .rank-badge{ background: #cfd3c8; color: var(--pitch-dark); }
  tbody tr:nth-child(3) .rank-badge{ background: #cd8a4f; color: var(--pitch-dark); }

  .rank-badge{
    font-family:'Cairo', sans-serif;
    font-weight:900;
    font-size:13px;
    color: var(--cream);
    background: var(--chalk-dim);
    min-width:26px;
    height:26px;
    border-radius:50%;
    display:inline-flex;
    align-items:center;
    justify-content:center;
  }
  .player-name{ font-size:15px; }
  td.center{ text-align:center; }

  .stat-input{
    width:52px;
    text-align:center;
    font-family:'Cairo', sans-serif;
    font-weight:700;
    font-size:14px;
    background: rgba(58,47,33,0.05);
    border: 1px solid var(--line);
    border-radius:8px;
    color: var(--chalk);
    padding:5px 4px;
  }
  .stat-input:focus{
    outline: 2px solid var(--gold);
    outline-offset: 1px;
    border-color: var(--gold);
  }
  .points-cell{
    font-family:'Cairo', sans-serif;
    font-weight:900;
    color: var(--gold);
    font-size:16px;
  }

  .empty{
    text-align:center;
    color: var(--chalk-dim);
    font-size:14px;
    padding:20px 0;
  }

  .actions{ display:flex; gap:10px; flex-wrap:wrap; margin-top:16px; }
  button.secondary{
    background: transparent;
    border:1px solid var(--chalk-dim);
    color: var(--chalk);
    font-family:'Tajawal', sans-serif;
    font-size:14px;
    padding:9px 16px;
    border-radius:10px;
    cursor:pointer;
  }
  button.secondary:hover{ background: rgba(58,47,33,0.06); }

  .toast{
    position:fixed;
    bottom:22px; left:50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--pitch-dark);
    color: var(--cream);
    font-family:'Cairo', sans-serif;
    font-weight:700;
    font-size:14px;
    padding:10px 18px;
    border-radius:10px;
    opacity:0;
    pointer-events:none;
    transition: all .25s ease;
    box-shadow: 0 8px 24px rgba(58,47,33,0.35);
  }
  .toast.show{ opacity:1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
<div class="wrap">
  <div class="top-nav">
    <a href="lineup.html">التشكيلة</a>
    <a href="ranking.html" class="active">الترتيب</a>
  </div>
  <header>
    <div class="eyebrow">موسم الأسبوعيات</div>
    <h1>الترتيب</h1>
    <div class="sub">نقاط الفوز لكل لاعب — ١٠ نقاط للفوز، صفر للخسارة</div>
  </header>

  <div class="card">
    <h2>جدول اللاعبين</h2>
    <table>
      <thead>
        <tr>
          <th>اللاعب</th>
          <th class="center">لعب</th>
          <th class="center">النقاط</th>
        </tr>
      </thead>
      <tbody id="rankingBody"></tbody>
    </table>
    <div class="empty" id="emptyState" style="display:none">مافيه لاعبين بعد. أضف أسماء من صفحة التشكيلة أول.</div>
    <div class="actions">
      <button class="secondary" onclick="saveAsImage()">حفظ كصورة (أفضل ٢٠)</button>
    </div>
  </div>
</div>

<div class="toast" id="toast">تم الحفظ ✓</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBcxBeY7pjJ5iEHB45-wJh6Pre0qSnZdVI",
    authDomain: "training-f7016.firebaseapp.com",
    projectId: "training-f7016",
    storageBucket: "training-f7016.firebasestorage.app",
    messagingSenderId: "263642447317",
    appId: "1:263642447317:web:664999b5955045eac2915c",
    measurementId: "G-XH8BPJJHQ2"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const sharedRef = doc(db, 'lineup', 'shared');
  const statsRef = doc(db, 'lineup', 'stats');

  let namesList = [];
  let statsMap = {};
  let saveTimer = null;
  let lastRows = [];

  function normalize(name){ return name.trim(); }

  let storageWarned = false;
  function notifyStorageIssue(){
    if(storageWarned) return;
    storageWarned = true;
    const toast = document.getElementById('toast');
    if(!toast) return;
    const original = toast.textContent;
    toast.textContent = 'تنبيه: تعذر الاتصال بقاعدة البيانات المشتركة الآن';
    toast.classList.add('show');
    setTimeout(() => {
      toast.classList.remove('show');
      setTimeout(() => { toast.textContent = original; }, 300);
    }, 3200);
  }

  function escapeHtml(str){
    const div = document.createElement('div');
    div.textContent = str;
    return div.innerHTML;
  }

  onSnapshot(sharedRef, (snap) => {
    const data = snap.exists() ? snap.data() : {};
    const raw = data.names || '';
    namesList = raw.split('\n').map(s => s.trim()).filter(s => s.length > 0);
    render();
  }, () => notifyStorageIssue());

  onSnapshot(statsRef, (snap) => {
    const data = snap.exists() ? snap.data() : {};
    statsMap = { ...(data.players || {}) };
    render();
  }, () => notifyStorageIssue());

  function allPlayerNames(){
    const set = new Map(); // normalized -> display name
    namesList.forEach(n => set.set(normalize(n), n));
    Object.keys(statsMap).forEach(k => { if(!set.has(k)) set.set(k, k); });
    return [...set.entries()]; // [normalized, displayName][]
  }

  function render(){
    const tbody = document.getElementById('rankingBody');
    const emptyState = document.getElementById('emptyState');
    const rows = allPlayerNames().map(([key, name]) => {
      const stat = statsMap[key] || { played: 0, points: 0 };
      return { key, name, played: stat.played || 0, points: stat.points || 0 };
    });

    rows.sort((a, b) => b.points - a.points || b.played - a.played);
    lastRows = rows;

    if(rows.length === 0){
      tbody.innerHTML = '';
      emptyState.style.display = 'block';
      return;
    }
    emptyState.style.display = 'none';

    tbody.innerHTML = rows.map((r, idx) => `
      <tr data-key="${escapeHtml(r.key)}">
        <td>
          <span class="rank-badge">${idx+1}</span>
          <span class="player-name">${escapeHtml(r.name)}</span>
        </td>
        <td class="center">
          <input type="number" min="0" class="stat-input played-input" value="${r.played}">
        </td>
        <td class="center">
          <input type="number" min="0" class="stat-input points-input" value="${r.points}">
        </td>
      </tr>
    `).join('');

    tbody.querySelectorAll('tr').forEach(tr => {
      const key = tr.dataset.key;
      tr.querySelector('.played-input').addEventListener('change', (e) => {
        updateStat(key, 'played', e.target.value);
      });
      tr.querySelector('.points-input').addEventListener('change', (e) => {
        updateStat(key, 'points', e.target.value);
      });
    });
  }

  function updateStat(key, field, value){
    const num = Math.max(0, parseInt(value, 10) || 0);
    const current = statsMap[key] || { played: 0, points: 0 };
    statsMap[key] = { ...current, [field]: num };
    scheduleSave();
  }

  function scheduleSave(){
    if(saveTimer) clearTimeout(saveTimer);
    saveTimer = setTimeout(async () => {
      try{
        await setDoc(statsRef, { players: statsMap }, { merge: true });
        const toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 1400);
      } catch(err){
        notifyStorageIssue();
      }
    }, 500);
  }

  // يرسم أفضل ٢٠ لاعب على كانفاس بنفس هوية التطبيق وينزّله كصورة PNG
  async function saveAsImage(){
    const rows = lastRows.slice(0, 20);
    if(rows.length === 0){
      const toast = document.getElementById('toast');
      const original = toast.textContent;
      toast.textContent = 'مافيه بيانات ترتيب بعد';
      toast.classList.add('show');
      setTimeout(() => { toast.classList.remove('show'); setTimeout(()=>{ toast.textContent = original; }, 300); }, 1800);
      return;
    }

    try{
      await Promise.all([
        document.fonts.load('900 30px Cairo'),
        document.fonts.load('700 16px Cairo'),
        document.fonts.load('900 18px Cairo'),
        document.fonts.load('600 17px Tajawal')
      ]);
    } catch(e){ /* تجاهل، بيرسم بالخط الاحتياطي لو صار خلل */ }

    const scale = 2;
    const width = 720;
    const headerHeight = 130;
    const rowHeight = 46;
    const footerHeight = 26;
    const height = headerHeight + rows.length * rowHeight + footerHeight;

    const canvas = document.createElement('canvas');
    canvas.width = width * scale;
    canvas.height = height * scale;
    const ctx = canvas.getContext('2d');
    ctx.scale(scale, scale);

    // خلفية بيج
    ctx.fillStyle = '#f1e8d3';
    ctx.fillRect(0, 0, width, height);

    // بطاقة بيضاء دافئة للمحتوى
    ctx.fillStyle = 'rgba(250,245,230,0.9)';
    roundRect(ctx, 16, 16, width - 32, height - 32, 16);
    ctx.fill();

    // العنوان
    ctx.fillStyle = '#1f4a30';
    ctx.font = '900 26px Cairo, sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'alphabetic';
    ctx.fillText('الترتيب — أفضل ٢٠ لاعب', width / 2, 52);

    ctx.fillStyle = '#8a7a63';
    ctx.font = '600 13px Tajawal, sans-serif';
    ctx.fillText('نقاط الفوز الأسبوعية', width / 2, 72);

    // رؤوس الأعمدة
    const nameX = width - 70;
    const playedX = 230;
    const pointsX = 110;
    const colY = 100;

    ctx.font = '700 12.5px Cairo, sans-serif';
    ctx.fillStyle = '#8a7a63';
    ctx.textAlign = 'right';
    ctx.fillText('اللاعب', nameX, colY);
    ctx.textAlign = 'center';
    ctx.fillText('لعب', playedX, colY);
    ctx.fillText('النقاط', pointsX, colY);

    ctx.strokeStyle = 'rgba(58,47,33,0.16)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(30, colY + 10);
    ctx.lineTo(width - 30, colY + 10);
    ctx.stroke();

    const badgeColors = ['#d9a441', '#cfd3c8', '#cd8a4f'];
    rows.forEach((r, idx) => {
      const y = headerHeight + idx * rowHeight;

      if(idx % 2 === 1){
        ctx.fillStyle = 'rgba(58,47,33,0.035)';
        ctx.fillRect(24, y, width - 48, rowHeight);
      }

      const badgeCx = width - 45, badgeCy = y + rowHeight / 2;
      ctx.beginPath();
      ctx.arc(badgeCx, badgeCy, 14, 0, Math.PI * 2);
      ctx.fillStyle = idx < 3 ? badgeColors[idx] : 'rgba(58,47,33,0.12)';
      ctx.fill();
      ctx.fillStyle = idx < 3 ? '#1f4a30' : '#8a7a63';
      ctx.font = '900 12.5px Cairo, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(String(idx + 1), badgeCx, badgeCy + 1);

      ctx.fillStyle = '#3a2f21';
      ctx.font = '600 16px Tajawal, sans-serif';
      ctx.textAlign = 'right';
      ctx.fillText(r.name, nameX, badgeCy);

      ctx.fillStyle = '#3a2f21';
      ctx.font = '700 15px Cairo, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(String(r.played), playedX, badgeCy);

      ctx.fillStyle = '#c8892c';
      ctx.font = '900 17px Cairo, sans-serif';
      ctx.fillText(String(r.points), pointsX, badgeCy);
    });

    ctx.textBaseline = 'alphabetic';

    canvas.toBlob((blob) => {
      if(!blob){ notifyStorageIssue(); return; }
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'ترتيب-اللاعبين.png';
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
      const toast = document.getElementById('toast');
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 1600);
    }, 'image/png');
  }

  function roundRect(ctx, x, y, w, h, r){
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  window.saveAsImage = saveAsImage;
</script>
</body>
</html>
